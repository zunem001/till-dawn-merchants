[package]
name = "tilldawn-market"
description = "The Grand Market of Till Dawn: AI merchants with wallets, NEP-245 goods, signed player intents, sealed AI decisions on a leash"
version = "1.0.0"
edition = "2024"
resolver = "3"
rust-version = "1.93"
repository = "https://github.com/zunem001/till-dawn-merchants"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.21.1-rust-1.96.0"
image_digest = "sha256:ccb22bb4e677ed022d8b9d1aa1b32f0af52dd0471ef1c32e48dedbf68ee6ee17"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[dependencies]
near-sdk = { version = "5.29", features = ["unstable"] }

[dev-dependencies]
near-sdk = { version = "5.29", features = ["unit-testing", "unstable"] }
k256 = { version = "0.13", features = ["ecdsa"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
